<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FCDR HWOS TV Overlay</title>
  <link rel="icon" type="image/png" href="/tablogo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9Oer+R4BEmj7Skz9YWeYuQm0I7qUoZ2nT7G58q6e5Q" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/tv.css" />
</head>
<body>
  <div id="tvApp" class="theme-government tv-app">
    <main id="tvMap"></main>
    <header class="tv-topbar">
      <div class="tv-logo"><img src="/tablogo.png" alt="FCDR" /></div>
      <div class="tv-title">
        <div class="eyebrow">Fulton County Disaster Response</div>
        <h1>HWOS Live Weather Monitor</h1>
        <div id="tvRegionLabel" class="subline">Loading region…</div>
      </div>
      <div class="tv-clock">
        <strong id="tvClock">--:--</strong>
        <span>LIVE</span>
      </div>
    </header>

    <aside id="tvGlobalPanel" class="tv-panel tv-global-panel hidden">
      <div class="section-title">Global Storm Alerts</div>
      <div id="tvGlobalAlerts" class="tv-alert-stack"></div>
    </aside>

    <aside id="tvLocalPanel" class="tv-panel tv-local-panel">
      <div id="tvLocalTitle" class="section-title">Alerts for this location</div>
      <div id="tvLocalAlerts" class="tv-alert-stack"></div>
    </aside>

    <section id="tvPopup" class="tv-alert-popup hidden" aria-live="polite"></section>

    <div class="tv-footer">
      <span id="tvStatus">Initializing.</span>
      <span>NOAA / NWS open data · Auto-refreshing</span>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/tv.js"></script>
</body>
</html>
